name: Refresh data and deploy encrypted preview

on:
  push:
    branches: [main, feature/github-pages-public-demo]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh tender data for scheduled validation
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TENDER_SNAPSHOT_BACKUP: ${{ runner.temp }}/radar-before-crawl.json
        run: cp public/data/radar.json "$TENDER_SNAPSHOT_BACKUP" && pnpm crawl

      - name: Keep the last fully verified snapshot
        if: always() && github.event_name != 'push'
        env:
          TENDER_SNAPSHOT_BACKUP: ${{ runner.temp }}/radar-before-crawl.json
        shell: bash
        run: |
          if node scripts/verify-snapshot.mjs public/data/radar.json "$TENDER_SNAPSHOT_BACKUP"; then
            echo "本次扫描通过快照门禁，发布新数据"
          else
            cp "$TENDER_SNAPSHOT_BACKUP" public/data/radar.json
            echo "本次扫描未通过快照门禁，继续验证上一份完整快照"
          fi

      - name: Build encrypted static site
        env:
          BIAOKANKAN_PREVIEW_PASSWORD: ${{ secrets.BIAOKANKAN_PREVIEW_PASSWORD }}
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload encrypted Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy encrypted preview
        id: deployment
        uses: actions/deploy-pages@v4
