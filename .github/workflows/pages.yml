name: Refresh data and deploy

on:
  push:
    branches: [main, feature/github-pages-public-demo]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh tender data
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TENDER_PREVIOUS_SNAPSHOT_URL: https://octopusgump.github.io/biaokankan/data/radar.json
          TENDER_SNAPSHOT_BACKUP: ${{ runner.temp }}/radar-before-crawl.json
        run: cp public/data/radar.json "$TENDER_SNAPSHOT_BACKUP" && pnpm crawl

      - name: Keep the last fully verified snapshot
        if: always() && github.event_name != 'push'
        env:
          TENDER_SNAPSHOT_BACKUP: ${{ runner.temp }}/radar-before-crawl.json
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const target = "public/data/radar.json"; let valid = false; try { const snapshot = JSON.parse(fs.readFileSync(target, "utf8")); valid = snapshot.run?.status === "成功" && snapshot.run?.succeededSources === snapshot.run?.sourceCount; } catch {} if (!valid) { fs.copyFileSync(process.env.TENDER_SNAPSHOT_BACKUP, target); console.log("本次扫描未全部成功，继续发布上一份完整快照"); }'

      - name: Build static site
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
