log_format biaokankan_access '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

map $uri $biaokankan_cache_control {
  default "private, no-cache";
  =/data/radar.json "private, no-store";
  ~*\.(?:css|js|png|jpg|jpeg|gif|webp|ico|woff2?)$ "private, max-age=604800, immutable";
}

# 服务器 IP、未备案域名和其他 Host 不提供网站内容。
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name biaokankan.com www.biaokankan.com;
  return 301 https://biaokankan.com$request_uri;
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.biaokankan.com;

  ssl_certificate /etc/letsencrypt/live/biaokankan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/biaokankan.com/privkey.pem;

  return 301 https://biaokankan.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name biaokankan.com;
  root /var/www/biaokankan/current;
  index index.html;

  charset utf-8;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/biaokankan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/biaokankan.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:BiaokankanTLS:10m;
  ssl_session_timeout 1d;

  # 满足任意一个条件即可访问：来自已登记网络，或企业凭证正确。
  # 启动前由 check-access-control.sh 验证这些文件，缺失时不能上线。
  satisfy any;
  include /etc/nginx/biaokankan/trusted-networks.conf;
  deny all;
  auth_basic "标看看封闭试用";
  auth_basic_user_file /etc/nginx/biaokankan/.htpasswd;

  access_log /var/log/nginx/biaokankan.access.log biaokankan_access;
  error_log /var/log/nginx/biaokankan.error.log warn;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /data/radar.json {
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    try_files $uri =404;
  }

  add_header Cache-Control $biaokankan_cache_control always;
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
